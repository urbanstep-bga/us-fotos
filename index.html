document.addEventListener('click',e=>{
  const t=e.target.closest('[data-size],[data-open],[data-close],[data-f],[data-sort],[data-home],#tf,#cf,#tmore');if(!t)return;
  const d=t.dataset;
  if(d.close){if(e.target.closest('#zin')&&!e.target.closest('button'))return;S.zoom=0}
  else if(d.size){S.size=d.size;S.zoom=0;window.scrollTo(0,0)}
  else if(d.home){S.size='';window.scrollTo(0,0)}
  else if(d.open)S.zoom=+d.open;
  else if(d.f){S[d.f==='b'?'fb':d.f==='c'?'fc':'ft']=+d.k}
  else if(d.sort)S.sort=d.sort;
  else if(t.id==='tf')S.fopen=!S.fopen;
  else if(t.id==='cf'){S.fb=S.fc=S.ft=-1;S.tagQ=''}
  else if(t.id==='tmore')S.tagMore=!S.tagMore;
  render();
});
document.addEventListener('input',e=>{if(e.target.id==='tq'){S.tagQ=e.target.value;const p=e.target.selectionStart;render();const i=$('tq');i.focus();i.setSelectionRange(p,p)}});
