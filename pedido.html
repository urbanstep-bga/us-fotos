<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedido · urbanstep.bga</title>
<meta property="og:type" content="website"><meta property="og:title" content="Pedido · urbanstep.bga">
<meta property="og:description" content="Camisetas del pedido">
<meta property="og:image" content="https://urbanstep-bga.github.io/us-fotos/logo.png"><meta name="twitter:card" content="summary"><script data-goatcounter="https://urbanstep.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>
<body style="margin:0;background:#0a0a0a;color:#f5f5f2;font-family:system-ui,sans-serif">
<div id="a" style="max-width:560px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px"><div style="text-align:center">Cargando…</div></div>
<script>
(async()=>{
const a=document.getElementById('a'),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
try{
const t=await (await fetch('index.html')).text();
const P=JSON.parse(t.match(/const P=(\[.*?\]);/s)[1]);
const q=new URLSearchParams(location.search).get('r')||'';
const items=q.split(',').map(x=>x.split('-')).filter(x=>+x[0]>0&&P[+x[0]-1]);
const pad=n=>String(n).padStart(3,'0');
a.innerHTML='<div style="text-align:center;font-size:30px;font-weight:800;letter-spacing:2px">PEDIDO · '+items.length+(items.length===1?' CAMISETA':' CAMISETAS')+'</div>'+items.map(x=>`<div style="background:#141414;border-radius:18px;overflow:hidden"><img src="f/${pad(+x[0])}.jpg" alt="" style="width:100%;display:block"><div style="padding:12px 16px;font-size:20px;font-weight:700">${esc(P[+x[0]-1])}<div style="font-size:15px;color:#b8b8b0;font-weight:400">REF ${pad(+x[0])} · Talla ${x[1]==='U'?'única':esc(x[1]||'')}</div></div></div>`).join('')||'<div style="text-align:center">No se encontró el pedido.</div>';
}catch(e){a.innerHTML='<div style="text-align:center">No se pudo cargar el pedido.</div>'}
})();
</script></body></html>
